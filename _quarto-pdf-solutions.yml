# Profile for the solutions PDF (document 3): the solutions of the practicals.
# It belongs to the same group as the other profiles, so it replaces the website settings. Render it with
#   quarto render --profile pdf-solutions --to typst
# The Typst format is shared and lives in _quarto.yml.
project:
  type: book
  output-dir: _book-pdf-solutions
book:
  title: "Ecological Models and Data Analysis: Solutions to the practicals"
  author: "Alejandro Morales"
  date: today
  output-file: "Ecological-Models-and-Data-Analysis-Solutions"
  chapters:
    - index.qmd
    - Chapter_1/Practicals/solution.qmd
    - Chapter_2/Practicals/solution.qmd
    - Chapter_3/Practicals/solution.qmd
    - Chapter_4/Practicals/solution.qmd
    - Chapter_5/Practicals/solution.qmd
    - Chapter_6/Practicals/solution.qmd
    - Chapter_7/Practicals/solution.qmd
    - Chapter_8/Practicals/solution.qmd
execute:
  eval: true
  freeze: auto
  warning: false
  message: false
