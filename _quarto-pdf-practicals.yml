# Profile for the practicals PDF (document 2): the student pages without solutions.
# It belongs to the same group as the other profiles, so it replaces the website settings. Render it with
#   quarto render --profile pdf-practicals --to typst
# The Typst format is shared and lives in _quarto.yml.
project:
  type: book
  output-dir: _book-pdf-practicals
book:
  title: "Ecological Models and Data Analysis: Practicals"
  author: "Alejandro Morales"
  date: today
  output-file: "Ecological-Models-and-Data-Analysis-Practicals"
  chapters:
    - index.qmd
    - Chapter_1/Practicals/no_solution.qmd
    - Chapter_2/Practicals/no_solution.qmd
    - Chapter_3/Practicals/no_solution.qmd
    - Chapter_4/Practicals/no_solution.qmd
    - Chapter_5/Practicals/no_solution.qmd
    - Chapter_6/Practicals/no_solution.qmd
    - Chapter_7/Practicals/no_solution.qmd
    - Chapter_8/Practicals/no_solution.qmd
execute:
  eval: true
  freeze: auto
  warning: false
  message: false
