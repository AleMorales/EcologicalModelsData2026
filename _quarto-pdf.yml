# Profile for the printable PDF (a Typst book). It belongs to the same group as
# dev and prod, so it replaces the website settings. Render it with
#   quarto render --profile pdf --to typst
# The book has the theory, the practicals and the supplements, with the solutions
# of the practicals as appendices.
project:
  type: book
  output-dir: _book-pdf
book:
  title: "Ecological Models and Data Analysis"
  author: "Alejandro Morales"
  date: today
  output-file: "Ecological-Models-and-Data-Analysis"
  chapters:
    - index.qmd
    - part: "Theory"
      chapters:
        - Chapter_1/Theory.qmd
        - Chapter_2/Theory.qmd
        - Chapter_3/Theory.qmd
        - Chapter_4/Theory.qmd
        - Case_study_1/Theory.qmd
        - Chapter_5/Theory.qmd
        - Chapter_6/Theory.qmd
        - Chapter_7/Theory.qmd
        - Case_study_2/Theory.qmd
        - Chapter_8/Theory.qmd
    - part: "Practicals"
      chapters:
        - Chapter_1/Practicals/no_solution.qmd
        - Chapter_2/Practicals/no_solution.qmd
        - Chapter_3/Practicals/no_solution.qmd
        - Chapter_4/Practicals/no_solution.qmd
        - Chapter_5/Practicals/no_solution.qmd
        - Chapter_6/Practicals/no_solution.qmd
        - Chapter_7/Practicals/no_solution.qmd
        - Chapter_8/Practicals/no_solution.qmd
    - part: "Supplements"
      chapters:
        - Supplements/distributions.qmd
        - Supplements/deterministic-functions.qmd
        - Supplements/calculus.qmd
        - Supplements/glossary.qmd
        - Supplements/symbols.qmd
        - Supplements/canned.qmd
  appendices:
    - Chapter_1/Practicals/solution.qmd
    - Chapter_2/Practicals/solution.qmd
    - Chapter_3/Practicals/solution.qmd
    - Chapter_4/Practicals/solution.qmd
    - Chapter_5/Practicals/solution.qmd
    - Chapter_6/Practicals/solution.qmd
    - Chapter_7/Practicals/solution.qmd
    - Chapter_8/Practicals/solution.qmd
format:
  typst:
    filters:
      - filters/typst-verb.lua
      - path: filters/typst-book.lua
        at: pre-quarto
    toc: true
    toc-depth: 2
    number-sections: true
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    fontsize: 10.5pt
    columns: 1
execute:
  eval: true
  freeze: auto
  warning: false
  message: false
