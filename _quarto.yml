project:
  type: website
profile:
  default: prod
  group:
    - [dev, prod, pdf, pdf-practicals, pdf-solutions]
website:
  reader-mode: true
  title: "Ecological Models and Data Analysis"
  sidebar:
    style: "docked"
    collapse-level: 1
    search: true
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
  # Typst settings shared by the three PDF profiles (pdf, pdf-practicals, pdf-solutions).
  typst:
    filters:
      - filters/typst-verb.lua
      - path: filters/typst-book.lua
        at: pre-quarto
      - path: filters/typst-external-refs.lua
        at: post-quarto
    toc: true
    toc-depth: 2
    number-sections: true
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    fontsize: 10.5pt
    columns: 1
# Practice callouts carry an ID with the prefix imp- so that Quarto numbers them on each
# page ("Practice 1: ...") and @imp-... references print "Practice 1".
language:
  crossref-imp-title: "Practice"
  crossref-imp-prefix: "Practice"
