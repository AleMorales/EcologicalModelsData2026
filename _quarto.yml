project:
  type: website
profile:
  default: prod
  group:
    - [dev, prod]
website:
  reader-mode: true
  title: "Ecological Models and Data Analysis"
  sidebar:
    style: "docked"
    collapse-level: 1
    search: true
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
# Practice callouts carry an ID with the prefix imp- so that Quarto numbers them on each
# page ("Practice 1: ...") and @imp-... references print "Practice 1".
language:
  crossref-imp-title: "Practice"
  crossref-imp-prefix: "Practice"
