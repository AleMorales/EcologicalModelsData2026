<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 105 850 395" role="img" aria-labelledby="title description">
  <title id="title">Hypothetical samples and the sampling distribution</title>
  <desc id="description">A model on the left generates three hypothetical samples, each a row of quadrats. Each sample gives one estimate, and the estimates are gathered into a histogram labelled sampling distribution. A bracket under the quadrats of the first sample marks the variation among quadrats; a bracket over the histogram marks the variation among samples. There are no axes or numbers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#263530"/>
    </marker>
  </defs>
  <rect y="105" width="850" height="395" fill="white"/>

  <!-- Model -->
  <rect x="10" y="247" width="130" height="90" rx="10" fill="#fff5ed" stroke="#D55E00" stroke-width="3"/>
  <text x="75" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#D55E00">Model</text>

  <!-- Arrows from the model to the samples -->
  <g fill="none" stroke="#263530" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M140 272 L205 167"/>
    <path d="M140 292 L205 292"/>
    <path d="M140 312 L205 417"/>
  </g>

  <!-- Quadrats of the three samples -->
  <g fill="#0072B2" fill-opacity="0.25" stroke="#0072B2" stroke-width="2">
    <rect x="215" y="154" width="26" height="26"/>
    <rect x="249" y="154" width="26" height="26"/>
    <rect x="283" y="154" width="26" height="26"/>
    <rect x="317" y="154" width="26" height="26"/>
    <rect x="351" y="154" width="26" height="26"/>
    <rect x="215" y="279" width="26" height="26"/>
    <rect x="249" y="279" width="26" height="26"/>
    <rect x="283" y="279" width="26" height="26"/>
    <rect x="317" y="279" width="26" height="26"/>
    <rect x="351" y="279" width="26" height="26"/>
    <rect x="215" y="404" width="26" height="26"/>
    <rect x="249" y="404" width="26" height="26"/>
    <rect x="283" y="404" width="26" height="26"/>
    <rect x="317" y="404" width="26" height="26"/>
    <rect x="351" y="404" width="26" height="26"/>
  </g>

  <!-- Arrows from each sample to its estimate -->
  <g fill="none" stroke="#263530" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M418 167 H468"/>
    <path d="M418 292 H468"/>
    <path d="M418 417 H468"/>
  </g>

  <!-- Arrows from the estimates to the sampling distribution -->
  <g fill="none" stroke="#263530" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M612 167 L665 305"/>
    <path d="M612 292 L665 320"/>
    <path d="M612 417 L665 335"/>
  </g>

  <!-- Sampling distribution -->
  <path d="M675 360 V335 H699 V295 H723 V255 H771 V295 H795 V335 H819 V360 Z" fill="#D55E00" fill-opacity="0.2" stroke="#D55E00" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#D55E00" stroke-width="2">
    <path d="M699 360 V335 M723 360 V295 M747 360 V255 M771 360 V295 M795 360 V335"/>
  </g>
  <path d="M665 360 H829" fill="none" stroke="#263530" stroke-width="2.5"/>

  <!-- Brackets: under the quadrats of one sample, over the estimates -->
  <g fill="none" stroke="#52605A" stroke-width="2.5">
    <path d="M215 188 V200 H377 V188"/>
    <path d="M675 242 V230 H819 V242"/>
  </g>

  <!-- Dots for further samples -->
  <g fill="#263530">
    <circle cx="296" cy="452" r="3.5"/>
    <circle cx="296" cy="467" r="3.5"/>
    <circle cx="296" cy="482" r="3.5"/>
    <circle cx="540" cy="452" r="3.5"/>
    <circle cx="540" cy="467" r="3.5"/>
    <circle cx="540" cy="482" r="3.5"/>
  </g>

  <!-- Labels -->
  <g font-family="Segoe UI, Arial, sans-serif" fill="#263530" font-size="30">
    <text x="215" y="142">Sample 1</text>
    <text x="215" y="267">Sample 2</text>
    <text x="215" y="392">Sample 3</text>
    <text x="384" y="175">…</text>
    <text x="384" y="300">…</text>
    <text x="384" y="425">…</text>
    <text x="478" y="177">estimate</text>
    <text x="478" y="302">estimate</text>
    <text x="478" y="427">estimate</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#52605A" font-size="25" text-anchor="middle">
    <text x="215" y="228" text-anchor="start">variation among quadrats</text>
    <text x="747" y="190">variation among</text>
    <text x="747" y="218">samples</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#D55E00" font-size="28" text-anchor="middle">
    <text x="747" y="398">Sampling</text>
    <text x="747" y="428">distribution</text>
  </g>
  <text x="845" y="494" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#52605A">Schematic</text>
</svg>
