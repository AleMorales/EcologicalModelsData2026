<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title description">
  <title id="title">The steps from a negative log-likelihood to a fit</title>
  <desc id="description">Four boxes from left to right, joined by arrows. The first is the negative log-likelihood, a function of parameters and data. The second is cmb(), which adds the data. The third is MakeADFun(), which adds the starting values and returns par, fn and gr. The fourth is optim(), which returns par, value and convergence.</desc>
  <rect width="1200" height="230" fill="white"/>
  <g fill="#F0F6F2" stroke="#164C43" stroke-width="3">
    <rect x="15" y="15" width="255" height="200" rx="10"/>
    <rect x="325" y="15" width="205" height="200" rx="10"/>
    <rect x="585" y="15" width="290" height="200" rx="10"/>
    <rect x="930" y="15" width="255" height="200" rx="10"/>
  </g>
  <g fill="none" stroke="#263530" stroke-width="4">
    <path d="M270 115 H322"/>
    <path d="M310 106 L322 115 L310 124"/>
    <path d="M530 115 H582"/>
    <path d="M570 106 L582 115 L570 124"/>
    <path d="M875 115 H927"/>
    <path d="M915 106 L927 115 L915 124"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#263530" font-size="27" text-anchor="middle">
    <text x="142" y="75" font-weight="700" fill="#164C43" font-size="32">NLL</text>
    <text x="142" y="130">(parameters,</text>
    <text x="142" y="165">data)</text>
    <text x="427" y="75" font-weight="700" fill="#164C43" font-size="32" font-family="Consolas, monospace">cmb()</text>
    <text x="427" y="130">+ data</text>
    <text x="730" y="75" font-weight="700" fill="#164C43" font-size="32" font-family="Consolas, monospace">MakeADFun()</text>
    <text x="730" y="130">+ starting values</text>
    <text x="730" y="175" font-family="Consolas, monospace">par, fn, gr</text>
    <text x="1057" y="75" font-weight="700" fill="#164C43" font-size="32" font-family="Consolas, monospace">optim()</text>
    <text x="1057" y="130" font-family="Consolas, monospace">par, value,</text>
    <text x="1057" y="165" font-family="Consolas, monospace">convergence</text>
  </g>
</svg>
