<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="title description">
  <title id="title">An optimiser walking down a negative log-likelihood curve</title>
  <desc id="description">A bowl-shaped curve of the negative log-likelihood against a parameter. Starting from a value on the left, three arrows go step by step down the curve to its lowest point, which is marked as the estimate on the horizontal axis. The axes have no numerical scales.</desc>
  <rect width="760" height="530" fill="white"/>
  <path d="M 130 90 L 140 107.4 L 160 140.6 L 180 171.7 L 200 200.8 L 220 227.8 L 240 252.7 L 260 275.6 L 280 296.3 L 300 315 L 320 331.6 L 340 346.1 L 360 358.6 L 380 369 L 400 377.3 L 420 383.5 L 440 387.7 L 460 389.7 L 470 390 L 490 388.5 L 510 384 L 530 376.4 L 550 365.8 L 570 352.2 L 590 335.6 L 610 315.9 L 630 293.2 L 650 267.5 L 670 238.8 L 690 207 L 700 190" fill="none" stroke="#D55E00" stroke-width="6" stroke-linejoin="round"/>
  <path d="M470 390 V445" fill="none" stroke="#64756D" stroke-width="2" stroke-dasharray="6 6"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#164C43"/>
    </marker>
  </defs>
  <g fill="none" stroke="#164C43" stroke-width="4" marker-end="url(#arrow)">
    <path d="M196 158 C 240 215, 285 270, 334 318"/>
    <path d="M350 326 C 375 345, 395 358, 421 366"/>
    <path d="M437 370 C 448 373, 455 375, 466 376"/>
  </g>
  <g fill="#164C43">
    <circle cx="180" cy="171.7" r="9"/>
    <circle cx="340" cy="346.1" r="7"/>
    <circle cx="430" cy="386" r="7"/>
    <circle cx="470" cy="390" r="9"/>
  </g>
  <g fill="none" stroke="#263530" stroke-width="3">
    <path d="M100 55 V445 H710"/>
    <path d="M94 70 L100 55 L106 70 M695 439 L710 445 L695 451"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#263530" font-size="28">
    <text x="222" y="150" fill="#164C43">Starting value</text>
    <text x="470" y="480" text-anchor="middle" fill="#164C43">Estimate</text>
    <text x="405" y="518" text-anchor="middle">Parameter</text>
    <text x="35" y="250" text-anchor="middle" transform="rotate(-90 35 250)">Negative log-likelihood</text>
    <text x="745" y="520" text-anchor="end" font-size="22" fill="#52605A">Schematic</text>
  </g>
</svg>
