<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="title description">
  <title id="title">A schematic feeding response: saturating curve and straight line</title>
  <desc id="description">A solid saturating curve rises rapidly at low prey density and approaches a maximum. A dashed straight line follows the curve over part of the range of prey densities and then keeps increasing above the maximum. The axes have no numerical scales.</desc>
  <rect width="760" height="530" fill="white"/>
  <g fill="none" stroke="#263530" stroke-width="3">
    <path d="M100 55 V425 H710"/>
    <path d="M94 70 L100 55 L106 70 M695 419 L710 425 L695 431"/>
  </g>
  <path d="M420 92 H700" fill="none" stroke="#64756D" stroke-width="2" stroke-dasharray="3 6"/>
  <path d="M100 425 L310 78" fill="none" stroke="#0072B2" stroke-width="5" stroke-dasharray="16 10"/>
  <path d="M100 425 C160 165 265 100 680 92" fill="none" stroke="#D55E00" stroke-width="6"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#263530" font-size="28">
    <text x="405" y="480" text-anchor="middle">Prey density</text>
    <text x="35" y="260" text-anchor="middle" transform="rotate(-90 35 260)">Feeding rate</text>
    <text x="326" y="76" fill="#0072B2">Straight line</text>
    <text x="700" y="76" text-anchor="end">Maximum</text>
    <text x="700" y="140" text-anchor="end" fill="#D55E00">Saturating curve</text>
    <text x="690" y="520" text-anchor="end" font-size="22" fill="#52605A">Schematic</text>
  </g>
</svg>
