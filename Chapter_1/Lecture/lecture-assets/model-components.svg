<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="title description">
  <title id="title">A schematic response curve with scattered observations</title>
  <desc id="description">A solid saturating curve of feeding rate against prey density, with hypothetical observations scattered above and below the curve at seven prey densities. The curve is labelled response function and the points are labelled observations. The axes have no numerical scales.</desc>
  <rect width="760" height="530" fill="white"/>
  <g fill="none" stroke="#263530" stroke-width="3">
    <path d="M100 40 V425 H710"/>
    <path d="M94 55 L100 40 L106 55 M695 419 L710 425 L695 431"/>
  </g>
  <g fill="#0072B2" fill-opacity="0.7">
    <circle cx="143" cy="322" r="7"/><circle cx="143" cy="300" r="7"/><circle cx="143" cy="281" r="7"/><circle cx="143" cy="262" r="7"/>
    <circle cx="210" cy="228" r="7"/><circle cx="210" cy="206" r="7"/><circle cx="210" cy="187" r="7"/><circle cx="210" cy="160" r="7"/>
    <circle cx="314" cy="170" r="7"/><circle cx="314" cy="148" r="7"/><circle cx="314" cy="124" r="7"/><circle cx="314" cy="104" r="7"/>
    <circle cx="383" cy="152" r="7"/><circle cx="383" cy="127" r="7"/><circle cx="383" cy="109" r="7"/><circle cx="383" cy="82" r="7"/>
    <circle cx="466" cy="139" r="7"/><circle cx="466" cy="113" r="7"/><circle cx="466" cy="96" r="7"/><circle cx="466" cy="70" r="7"/>
    <circle cx="565" cy="131" r="7"/><circle cx="565" cy="107" r="7"/><circle cx="565" cy="84" r="7"/><circle cx="565" cy="63" r="7"/>
    <circle cx="660" cy="128" r="7"/><circle cx="660" cy="101" r="7"/><circle cx="660" cy="85" r="7"/><circle cx="660" cy="58" r="7"/>
  </g>
  <path d="M100 425 C160 165 265 100 680 92" fill="none" stroke="#D55E00" stroke-width="6"/>
  <path d="M370 290 H420" fill="none" stroke="#D55E00" stroke-width="6"/>
  <circle cx="395" cy="340" r="7" fill="#0072B2" fill-opacity="0.7"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#263530" font-size="28">
    <text x="405" y="480" text-anchor="middle">Prey density</text>
    <text x="35" y="240" text-anchor="middle" transform="rotate(-90 35 240)">Feeding rate</text>
    <text x="436" y="300">Response function</text>
    <text x="436" y="350">Observations</text>
    <text x="690" y="520" text-anchor="end" font-size="22" fill="#52605A">Schematic</text>
  </g>
</svg>
